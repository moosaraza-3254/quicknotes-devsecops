<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes — DevSecOps Board</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.25rem;
      }
      p.sub {
        color: #475569;
        margin-top: 0;
      }
      form {
        display: flex;
        gap: 8px;
        margin: 20px 0;
      }
      input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 1rem;
      }
      button {
        padding: 10px 18px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      small {
        color: #64748b;
        display: block;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>QuickNotes</h1>
    <p class="sub">
      Containerized Microservices on AWS (DevSecOps Final Project)
    </p>
    <form id="note-form">
      <input
        id="note-input"
        type="text"
        maxlength="280"
        placeholder="Write a quick note..."
        required
      />
      <button type="submit">Post</button>
    </form>
    <ul id="notes-list"></ul>
    <script src="/app.js"></script>
  </body>
</html>
