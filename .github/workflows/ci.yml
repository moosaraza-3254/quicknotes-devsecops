name: CI Pipeline (Stages 1-10)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Stage 2 - Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-format:
    name: Stage 3 - Format & Lint (Prettier + ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix api ci
          npm --prefix web ci

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  infra-lint:
    name: Stage 4 - Dockerfile & Shell Lint (Hadolint + ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Lint api/Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint web/Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile

      - name: Lint shell scripts with ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  unit-tests:
    name: Stage 5 & 6 - Unit Tests & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Install service dependencies
        run: |
          npm --prefix api ci
          npm --prefix web ci

      - name: Run API tests with coverage gate
        run: npm --prefix api test

      - name: Run Web tests with coverage gate
        run: npm --prefix web test

      - name: Upload coverage reports for SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            api/coverage/lcov.info
            web/coverage/lcov.info

  sonarcloud:
    name: Stage 7 - SAST & Quality Gate (SonarCloud)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk-scan:
    name: Stage 8 - Dependency Vulnerability Scan (Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'

      - name: Install dependencies for accurate lockfile tree
        run: |
          npm ci
          npm --prefix api ci
          npm --prefix web ci

      - name: Run Snyk SCA scan (fail on High/Critical)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

  docker-build-and-scan:
    name: Stage 9 & 10 - Docker Build & Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-format, infra-lint, unit-tests]
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build quicknotes-api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          tags: quicknotes-api:${{ github.sha }}

      - name: Build quicknotes-web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          tags: quicknotes-web:${{ github.sha }}

      - name: Stage 10 - Trivy scan on quicknotes-api
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quicknotes-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Stage 10 - Trivy scan on quicknotes-web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quicknotes-web:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
