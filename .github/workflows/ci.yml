name: CI/CD Pipeline (Stages 1-12)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  secret-scan:
    name: Stage 2 - Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-format:
    name: Stage 3 - Format & Lint (Prettier + ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix api ci
          npm --prefix web ci

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  infra-lint:
    name: Stage 4 - Dockerfile & Shell Lint (Hadolint + ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Lint api/Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint web/Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile

      - name: Lint shell scripts with ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  unit-tests:
    name: Stage 5 & 6 - Unit Tests & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Install service dependencies
        run: |
          npm --prefix api ci
          npm --prefix web ci

      - name: Run API tests with coverage gate
        run: npm --prefix api test

      - name: Run Web tests with coverage gate
        run: npm --prefix web test

      - name: Upload coverage reports for SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            api/coverage/lcov.info
            web/coverage/lcov.info

  sonarcloud:
    name: Stage 7 - SAST & Quality Gate (SonarCloud)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk-scan:
    name: Stage 8 - Dependency Vulnerability Scan (Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.3'

      - name: Install dependencies for accurate lockfile tree
        run: |
          npm ci
          npm --prefix api ci
          npm --prefix web ci

      - name: Run Snyk SCA scan (fail on High/Critical)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

  docker-build-and-scan:
    name: Stage 9 & 10 - Docker Build & Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-format, infra-lint, unit-tests]
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build quicknotes-api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          tags: quicknotes-api:${{ github.sha }}

      - name: Build quicknotes-web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          load: true
          tags: quicknotes-web:${{ github.sha }}

      - name: Stage 10 - Trivy scan on quicknotes-api
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quicknotes-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Stage 10 - Trivy scan on quicknotes-web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quicknotes-web:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  deploy-aws:
    name: Stage 11 & 12 - ECR Push & SSM Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sonarcloud, snyk-scan, docker-build-and-scan]
    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage 11 - Build and push quicknotes-api to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/quicknotes-api:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/quicknotes-api:latest

      - name: Stage 11 - Build and push quicknotes-web to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/quicknotes-web:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/quicknotes-web:latest

      - name: Stage 12 - Deploy containers to EC2 via AWS SSM
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          cat << 'SCRIPT' > deploy_ssm.py
          import json, os, subprocess, time
          from urllib.parse import urlparse

          db = urlparse(os.environ["DATABASE_URL"])
          registry = os.environ["REGISTRY"]
          tag = os.environ["IMAGE_TAG"]
          region = os.environ["AWS_REGION"]
          instance_id = os.environ["EC2_INSTANCE_ID"]
          api_url = os.environ["API_URL"]

          commands = [
              "set -e",
              f"aws ecr get-login-password --region {region} | docker login --username AWS --password-stdin {registry}",
              f"docker pull {registry}/quicknotes-api:{tag}",
              f"docker pull {registry}/quicknotes-web:{tag}",
              "docker rm -f quicknotes-api quicknotes-web || true",
              (
                  f"docker run -d --name quicknotes-api --restart unless-stopped -p 3000:3000 "
                  f"-e PORT=3000 "
                  f"-e DB_HOST={db.hostname} "
                  f"-e DB_PORT={db.port or 5432} "
                  f"-e DB_NAME={db.path.lstrip('/')} "
                  f"-e DB_USER={db.username} "
                  f"-e DB_PASSWORD={db.password} "
                  f"-e DB_SSL=true "
                  f"{registry}/quicknotes-api:{tag}"
              ),
              (
                  f"docker run -d --name quicknotes-web --restart unless-stopped -p 8080:8080 "
                  f"-e PORT=8080 "
                  f"-e API_URL={api_url} "
                  f"{registry}/quicknotes-web:{tag}"
              ),
              "sleep 5",
              "docker ps"
          ]

          payload = json.dumps({"commands": commands})
          cmd_id = subprocess.check_output([
              "aws", "ssm", "send-command",
              "--instance-ids", instance_id,
              "--document-name", "AWS-RunShellScript",
              "--parameters", payload,
              "--query", "Command.CommandId",
              "--output", "text"
          ]).decode().strip()

          print(f"Dispatched SSM Command ID: {cmd_id}")
          for _ in range(30):
              time.sleep(5)
              res = json.loads(subprocess.check_output([
                  "aws", "ssm", "get-command-invocation",
                  "--command-id", cmd_id,
                  "--instance-id", instance_id
              ]).decode())
              status = res["Status"]
              print(f"SSM Status: {status}")
              if status == "Success":
                  print(res.get("StandardOutputContent", ""))
                  break
              if status in ("Failed", "Cancelled", "TimedOut"):
                  print(res.get("StandardErrorContent", ""))
                  raise SystemExit(1)
          else:
              raise SystemExit("Timed out waiting for SSM deployment")
          SCRIPT
          python3 deploy_ssm.py

      - name: Stage 12 - Live ALB Smoke Tests
        env:
          ALB_DNS: ${{ secrets.ALB_DNS }}
        run: |
          set -e
          echo "Waiting 15s for ALB target health checks..."
          sleep 15
          curl -fsS "http://${ALB_DNS}/health"
          echo ""
          curl -fsS "http://${ALB_DNS}/api/health"
          echo ""
          curl -fsS -X POST "http://${ALB_DNS}/api/notes" \
            -H "Content-Type: application/json" \
            -d '{"title":"DevSecOps Smoke Test","content":"Deployed via OIDC + SSM"}'
          echo ""
          curl -fsS "http://${ALB_DNS}/api/notes"
          echo ""
